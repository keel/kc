<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 后台管理系统</title>
  <link rel="stylesheet" href="css/ui.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 400px; }
        .login-card h1 { text-align: center; margin-bottom: 24px; font-size: 24px; }
    </style>
</head>

<body>
  <div class="ui-card login-card">
    <h1>后台管理系统</h1>
    <form id="login-form">
      <div class="ui-form-item">
        <label for="username">用户名</label>
        <input type="text" id="username" class="ui-input" value="admin" required>
      </div>
      <div class="ui-form-item">
        <label for="password">密码</label>
        <input type="password" id="password" class="ui-input" value="password" required>
      </div>
      <div class="ui-form-item">
        <button type="submit" class="ui-button primary" style="width: 100%;">登录</button>
      </div>
    </form>
  </div>
  <script src="js/jquery.min.js"></script>
  <script src="js/ui.js"></script>
  <script>
  $(document).ready(function() {
    // 登录逻辑
    $('#login-form').on('submit', function(e) {
      e.preventDefault();
      // 模拟登录
      var username = $('#username').val();
      var password = $('#password').val();
      if (username === 'admin' && password === 'password') {
        AdminUI.toast('登录成功, 正在跳转...', 'success');
        setTimeout(function() {
          window.location.href = 'main.html';
        }, 1500);
      } else {
        AdminUI.popWin.alert('用户名或密码错误！');
      }
    });
  });
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户详情</title>
  <link rel="stylesheet" href="css/ui.css">
</head>

<body>
  <div id="admin-layout">
    <aside id="admin-sidebar">
      <div class="logo"><a href="main.html"><span>Admin UI</span></a></div>
      <div class="sidebar-menu-container">
        <ul class="ui-menu" id="main-menu"></ul>
      </div>
    </aside>
    <div id="admin-content">
      <header id="admin-header">
        <div id="admin-header-left"><button id="menu-toggle" class="ui-button icon-button"></button></div>
        <div id="admin-header-right"><button id="theme-toggle" class="ui-button icon-button"></button>
          <div class="ui-dropdown"><a href="#" class="ui-dropdown-toggle user-info">
              <div class="avatar" id="avatar"></div><span>admin</span>  
            </a>
            <div class="ui-dropdown-menu"><a href="#">个人信息</a>
              <div class="ui-dropdown-divider"></div><a href="login.html">退出登录</a>
            </div>
          </div>
        </div>
      </header>
      <main id="main-content">
        <div class="ui-container">
          <div class="ui-card">
            <div class="page-header">
              <h3 class="page-title">用户详情</h3>
              <div class="page-actions">
                <button class="ui-button" id="btn-back">返回列表</button>
                <button class="ui-button" id="btn-cancel" style="display: none;">取消</button>
                <button class="ui-button primary" id="btn-modify">修改</button>
                <button class="ui-button primary" id="btn-save" style="display: none;">保存</button>
              </div>
            </div>
            <hr class="ui-divider">
            <div id="user-detail-container">
              <!-- 表单将动态生成在这里 -->
              <form id="user-detail-form" class="view-mode">
                <div class="detail-form-grid"></div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/jquery.min.js"></script>
  <script src="js/kc.js"></script>
  <script src="js/ui.js"></script>
  <script>
    $(document).ready(function () {
      var originalUserData = null;
      var $form = $('#user-detail-form');
      var schema = AdminUI.mockData.userSchema;


      AdminUI.icons.create('menu', '#menu-toggle').create('avatar', '#avatar').create('moon', '#theme-toggle').create('sun', '#theme-toggle');
      AdminUI.theme.update();

      function setMode(mode) {
        if (mode === 'edit') {
          $form.removeClass('view-mode').addClass('edit-mode');
          $('#btn-modify').hide(); $('#btn-back').hide();
          $('#btn-save').show(); $('#btn-cancel').show();
        } else {
          $form.addClass('view-mode').removeClass('edit-mode');
          $('#btn-modify').show(); $('#btn-back').show();
          $('#btn-save').hide(); $('#btn-cancel').hide();
          $('.is-invalid').removeClass('is-invalid');
        }
      }

      // 基于 Schema 的动态验证
      function validateForm() {
        var isValid = true;
        $('.is-invalid').removeClass('is-invalid');
        $('.invalid-feedback').remove();

        for (var fieldName in schema) {
          var field = schema[fieldName];
          if (field.required) {
            var $input = $('#' + fieldName);
            if ($input.val().trim() === '') {
              $input.closest('.ui-form-item').find('.ui-input, .ui-select').addClass('is-invalid');
              $input.closest('.ui-form-item').append('<div class="invalid-feedback">' + field.label + '不能为空。</div>');
              isValid = false;
              continue;
            }
          }
          if (field.type === 'email') {
            var $input = $('#' + fieldName);
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test($input.val().trim())) {
              $input.addClass('is-invalid');
              isValid = false;
              $input.closest('.ui-form-item').append('<div class="invalid-feedback">邮箱格式不正确。</div>');
              continue;
            }
          }
        }
        return isValid;
      }

      // 基于 Schema 动态收集数据
      function collectFormData() {
        var formData = {};
        for (var fieldName in schema) {
          formData[fieldName] = $('#' + fieldName).val();
        }
        return formData;
      }

      // --- 页面初始化 ---
      $('#main-menu').html(AdminUI.buildMenu(AdminUI.mockData.menuData, false));

      var userId = kc.getUrlPara('id');
      if (userId) {
        originalUserData = AdminUI.mockData.users.find(u => u.id == userId);
        if (originalUserData) {
          // 动态渲染表单
          AdminUI.form.render('#user-detail-form .detail-form-grid', schema, originalUserData);
        } else {
          // ... error handling
        }
      } else {
        // ... error handling
      }

      // --- 事件绑定 ---
      $('#btn-back').on('click', () => window.location.href = 'list.html');
      $('#btn-modify').on('click', () => setMode('edit'));

      $('#btn-cancel').on('click', function () {
        // 只需重新渲染即可恢复
        AdminUI.form.render('#user-detail-form .detail-form-grid', schema, originalUserData);
        setMode('view');
      });

      $('#btn-save').on('click', function () {
        if (validateForm()) {
          var updatedData = collectFormData();
          updatedData.id = originalUserData.id; // 保持ID不变

          // 更新 '原始' 数据以备下次取消
          originalUserData = updatedData;

          // 更新并重新渲染
          AdminUI.form.render('#user-detail-form .detail-form-grid', schema, updatedData);
          setMode('view');
          AdminUI.toast('用户信息已保存', 'success');
        } else {
          AdminUI.toast('请检查表单输入', 'danger');
        }
      });
    });
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-CN">
<!--
* proj_p.js 实现api接口,包含分页数据,schema
* 本页js,从ajax按页码拉取数据,render表格
* 如列表页可由render完成，则不需要再生成tpl，直接由proj_p/list渲染标准list.tpl即可,特殊页面可由list.tpl修改得到

 -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列表</title>
  <link rel="stylesheet" href="css/ui.css">
</head>

<body>
  <div id="admin-layout">
    <!-- 左侧边栏 -->
    <aside id="admin-sidebar">
      <div class="logo">
        <a href="main.html"><span>Admin UI</span></a>
      </div>
      <div class="sidebar-menu-container">
        <ul class="ui-menu" id="main-menu">
          <!-- 菜单项将由JS动态生成 -->
        </ul>
      </div>
    </aside>
    <!-- 右侧主内容区 -->
    <div id="admin-content">
      <!-- 顶部栏 -->
      <header id="admin-header">
        <div id="admin-header-left">
          <button id="menu-toggle" class="ui-button icon-button">
            <!-- icon from: https://feathericons.com/ -->
          </button>
        </div>
        <div id="admin-header-right">
          <button id="theme-toggle" class="ui-button icon-button">
          </button>
          <div class="ui-dropdown">
            <a href="#" class="ui-dropdown-toggle user-info">
              <div class="avatar" id="avatar">
              </div>
              <span>admin</span>
            </a>
            <div class="ui-dropdown-menu">
              <a href="#">个人信息</a>
              <div class="ui-dropdown-divider"></div>
              <a href="login.html">退出登录</a>
            </div>
          </div>
        </div>
      </header>
      <!-- 内容区域 -->
      <main id="main-content">
        <div class="ui-container">
          <!-- 搜索/过滤卡片 -->
          <div class="ui-card" style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
              <h3 style="margin: 0;" id="tableTitle">列表</h3>
              <div style="display: flex; gap: 10px;">
                <button class="ui-button" id="search-btn">查询</button>
                <a href="add.html" class="ui-button primary">新增</a>
              </div>
            </div>
            <hr class="ui-divider">
            <div id="tableSearch" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
            </div>
          </div>
          <!-- 列表卡片 -->
          <div class="ui-card" id="user-list-container">
            <div class="ui-table-container" id="listTable">
            </div>
            <!-- 分页容器 -->
            <div id="pagination-container" class="ui-pagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/jquery.min.js"></script>
  <script src="js/ui.js"></script>
  <script>
  // 在引入ui.js之后
  $(document).ready(function() {

    // --- 动态生成菜单 ---
    $('#main-menu').html(AdminUI.buildMenu(AdminUI.mockData.menuData, false));


    AdminUI.icons.create('menu', '#menu-toggle').create('avatar', '#avatar').create('moon', '#theme-toggle').create('sun', '#theme-toggle');
    AdminUI.theme.update();

    var state = {
      init: false,
      currentPage: 1,
      itemsPerPage: 3, // 为了演示效果，每页显示3条
      tableData: AdminUI.mockData.users, // 完整的模拟数据
      tableSchema: {
        'name': '用户列表',
        'col_id': 'id',
        'link_col': 'username',
        'cols': [{
            "prop": "id",
            "label": "id",
            "search": "int",
            "hide": 'all',
          }, {
            "prop": "username",
            "label": "用户名",
            "default": "",
            "search": "string",
            "toOne": 1,
          },
          {
            "prop": "email",
            "label": "邮箱",
            "default": "",
            "search": "string",
          },
          {
            "prop": "role",
            "label": "角色",
            "default": "",
            // "hide": "list",
            'search': 'select',
            'input': {
              'type': 'select',
              'data': [
                { val: 'Admin', label: '管理员' },
                { val: 'Editor', label: '编辑' },
                { val: 'Viewer', label: '查看者' },
              ]
            }
          },
          {
            "prop": "status",
            "label": "状态",
            "default": "",
            'search': 'select',
            "input": {
              "type": "select",
              'data': [
                { val: 'Active', label: 'Active' },
                { val: 'Inactive', label: 'Inactive' },
                { val: 'Banned', label: 'Banned' },
              ]
            },
            // "hide": "list"
          },
          {
            "prop": "created_at",
            "label": "创建时间",
            "default": "",
            "search": "datetime",
            "input": {
              "type": "datetime",
            },
            // "hide": "list"
          },
        ]
      }
    };

    function renderSearch(tableSchema) {
      var str = '';
      for (let i = 0, len = tableSchema.cols.length; i < len; i++) {
        var one = tableSchema.cols[i];
        if (!one.search) {
          continue;
        }
        str += '<div class="ui-form-item" style="margin: 0;"><label>' + one.label + '</label>';
        if (one.search === 'int') {
          str += '<input id="search_' + one.prop + '" name="search_' + one.prop + '" type="number" class="ui-input" placeholder="输入' + one.label + '">';
        } else if (one.search === 'select') {
          str += '<select id="search_' + one.prop + '" name="search_' + one.prop + '"  class="ui-input" data-ui-select>';
          for (let j = 0, len = one.input.data.length; j < len; j++) {
            var vOne = one.input.data[j];
            str += '<option value="' + vOne.val + '">' + vOne.label + '</option>';
          }
          str += '</select>';
        } else if (one.search === 'datetime') {
          str += '<input id="search_' + one.prop + '" name="search_' + one.prop + '" type="text" class="ui-input" placeholder="选择日期范围" data-ui-daterangepicker />';
        } else {
          str += '<input id="search_' + one.prop + '" name="search_' + one.prop + '" type="text" class="ui-input" placeholder="输入' + one.label + '">';
        }
        str += '</div>';
      }
      $('#tableSearch').html(str);
      AdminUI.update();
    }

    function renderTableAndPagination(page) {
      state.currentPage = page || 1;

      // 模拟加载动画
      AdminUI.loading.show('#user-list-container');



      // 模拟AJAX延迟
      setTimeout(function() {
        var tableData = state.tableData;
        var tableSchema = state.tableSchema;
        if (!state.init) {
          state.init = true;
          $('#tableTitle').text(tableSchema.name);
          renderSearch(tableSchema);
        }

        var start = (state.currentPage - 1) * state.itemsPerPage;
        var end = start + state.itemsPerPage;
        var pageData = tableData.slice(start, end);
        var tableHead = '<table class="ui-table" id="list-table"> <thead> <tr> ';
        for (let i = 0, len = tableSchema.cols.length; i < len; i++) {
          var one = tableSchema.cols[i];
          if (one.hide && (one.hide.indexOf('list') >= 0 || one.hide.indexOf('all') >= 0)) {
            continue;
          }
          tableHead += '<th>' + one.label + '</th>';
        }

        tableHead += '</tr> </thead> <tbody>';

        // 渲染表格
        var tableBody = '';
        for (var i = 0; i < pageData.length; i++) {
          tableBody += '<tr>';
          var pData = pageData[i];

          for (let j = 0, len = tableSchema.cols.length; j < len; j++) {
            var sOne = tableSchema.cols[j];
            if (sOne.hide && (sOne.hide.indexOf('list') >= 0 || sOne.hide.indexOf('all') >= 0)) {
              continue;
            }
            if (sOne.toOne) {
              tableBody += '<td><a href="detail.html?id=' + pData[tableSchema.col_id] + '">' + pData[sOne.prop] + '</a></td>';
              continue;
            }
            tableBody += '<td>' + pData[sOne.prop] + '</td>';
          }
          tableBody += '</tr>';
        }
        $('#listTable').html(tableHead + tableBody + '</tbody></table>');

        // 渲染分页
        AdminUI.pageNav.init('#pagination-container', {
          currentPage: state.currentPage,
          totalPages: Math.ceil(tableData.length / state.itemsPerPage),
          totalItems: tableData.length,
          onPageChange: function(newPage) {
            // 当点击分页按钮时，此回调函数被触发
            renderTableAndPagination(newPage);
          }
        });


        // 隐藏加载动画
        AdminUI.loading.hide('#user-list-container');

      }, 300); // 模拟网络延迟
    }

    renderTableAndPagination();

    $('#search-btn').on('click', renderTableAndPagination); // 模拟查询

    // 删除操作
    $(document).on('click', '#user-table .danger', function() {
      var userId = $(this).data('id');
      AdminUI.popWin.confirm('确定要删除这个用户吗？', function() {
        AdminUI.toast('用户 ' + userId + ' 已删除', 'success');
        // 这里应该有真实的删除逻辑和重新渲染表格
        renderTableAndPagination();
      });
    });
  });
  </script>
</body>

</html>
